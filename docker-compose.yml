name: smoi

services:
  db:
    # Same image the integration tests use (see backend/pom.xml <pgvector.image>).
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images store data in a version-specific subfolder of /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local model server (embeddings, and the chat model from Phase 2). Document text never
  # leaves the machine. Published on 127.0.0.1 only, so a backend run with ./mvnw and the
  # eval scripts can reach it; change OLLAMA_PORT if a native Ollama already uses 11434.
  ollama:
    image: ollama/ollama:0.40.13
    environment:
      # How many requests Ollama computes at once. Raising it to 4 did not help on a CPU-only
      # machine (each request already uses every core), so it stays at Ollama's default of 1.
      # Measured in docs/performance.md; worth retrying with a GPU.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off: downloads the embedding model (about 274 MB) and the local chat model (about
  # 1.9 GB for the default) into the ollama volume the first time, then exits.
  # PULL_CHAT_MODEL=false skips the chat model (the retrieval-only CI check doesn't need it).
  ollama-pull:
    image: ollama/ollama:0.40.13
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
      EMBED_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.5:2b-q4_K_M}
      PULL_CHAT_MODEL: ${PULL_CHAT_MODEL:-true}
    entrypoint: ["sh", "-c", "ollama pull \"$$EMBED_MODEL\" && if [ \"$$PULL_CHAT_MODEL\" != false ]; then ollama pull \"$$CHAT_MODEL\"; fi"]
    restart: "no"

  # Optional cross-encoder reranker (sidecars/reranker). Start it with
  # `docker compose --profile rerank up` and set RERANK_ENABLED=true in .env.
  reranker:
    profiles: ["rerank"]
    build: ./sidecars/reranker
    ports:
      - "127.0.0.1:${RERANKER_PORT:-8001}:8001"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-PT1H}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      INGESTION_WORKERS: ${INGESTION_WORKERS:-2}
      CHUNK_MAX_TOKENS: ${CHUNK_MAX_TOKENS:-500}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-75}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3.5:2b-q4_K_M}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      RERANK_ENABLED: ${RERANK_ENABLED:-false}
      RERANKER_URL: ${RERANKER_URL:-http://reranker:8001}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-25MB}
      STUB_LLM_LATENCY: ${STUB_LLM_LATENCY:-PT0.2S}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_QUERY_CAPACITY: ${RATE_LIMIT_QUERY_CAPACITY:-20}
      RATE_LIMIT_QUERY_PER_MINUTE: ${RATE_LIMIT_QUERY_PER_MINUTE:-30}
      RATE_LIMIT_SEARCH_CAPACITY: ${RATE_LIMIT_SEARCH_CAPACITY:-60}
      RATE_LIMIT_SEARCH_PER_MINUTE: ${RATE_LIMIT_SEARCH_PER_MINUTE:-120}
      RATE_LIMIT_UPLOAD_CAPACITY: ${RATE_LIMIT_UPLOAD_CAPACITY:-20}
      RATE_LIMIT_UPLOAD_PER_MINUTE: ${RATE_LIMIT_UPLOAD_PER_MINUTE:-30}
      # Metrics on 8081 inside the Compose network only; Prometheus scrapes it.
      MANAGEMENT_PORT: "8081"
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-true}
      TRACING_SAMPLING: ${TRACING_SAMPLING:-1.0}
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_FORMAT: ${LOG_FORMAT:-logstash}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  # NFR-06.04: API and ingestion workers as separate processes, chosen by configuration only.
  # `docker compose --profile split up -d backend-api backend-worker` (instead of "backend").
  # Same image; the API process runs no workers, the worker process takes no API traffic.
  backend-api:
    profiles: ["split"]
    extends: backend
    environment:
      INGESTION_WORKERS: "0"
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  backend-worker:
    profiles: ["split"]
    extends: backend
    environment:
      INGESTION_WORKERS: ${INGESTION_WORKERS:-2}
    ports: !reset []

  # ---------- Observability (docs/adr/0011) ----------

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.2.5
    depends_on: [prometheus, jaeger]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Read-only dashboards without logging in; only reachable from this machine.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/smoi-api.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

  # Traces: the backend sends OTLP over HTTP to 4318 (inside the network); UI on 16686.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"

volumes:
  db-data:
  ollama-models:
