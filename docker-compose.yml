name: smoi

services:
  db:
    # Same image the integration tests use (see backend/pom.xml <pgvector.image>).
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images store data in a version-specific subfolder of /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local embedding model server. Document text never leaves the machine.
  # Not published to the host: only the backend talks to it.
  ollama:
    image: ollama/ollama:0.40.13
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off: downloads the embedding model into the ollama volume (about 274 MB the first
  # time, instant afterwards), then exits.
  ollama-pull:
    image: ollama/ollama:0.40.13
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"]
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-PT1H}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      INGESTION_WORKERS: ${INGESTION_WORKERS:-2}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-25MB}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

volumes:
  db-data:
  ollama-models:
