spring:
  application:
    name: smoi-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smoi}
    username: ${DB_USER:smoi}
    password: ${DB_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Largest file SMOI Brain accepts. Larger uploads get 413 Payload Too Large.
      max-file-size: ${MAX_UPLOAD_SIZE:25MB}
      max-request-size: ${MAX_UPLOAD_SIZE:25MB}

smoi:
  jwt:
    # Base64-encoded HMAC key, at least 32 bytes after decoding. Set in .env.
    secret: ${JWT_SECRET:}
    issuer: smoi
    ttl: ${JWT_TTL:PT1H}
  ingestion:
    # Background worker threads. 0 disables them (for an API-only process).
    workers: ${INGESTION_WORKERS:2}
    poll-interval: PT1S
    lease: PT2M
    max-attempts: 5
    backoff-base: PT10S
    backoff-max: PT10M
  chunking:
    max-tokens: 500
    overlap-tokens: 75
  llm:
    # ollama (local, default) or anthropic (hosted, opt-in; needs ANTHROPIC_API_KEY). A hosted
    # provider only receives documents whose hostedLlmAllowed setting is on.
    provider: ${LLM_PROVIDER:ollama}
    # Includes thinking tokens on Claude models, so leave room beyond the answer itself.
    max-output-tokens: 2048
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      # Chosen by eval/bench_local_llm.py; see eval/README.md.
      model: ${OLLAMA_CHAT_MODEL:qwen3.5:2b-q4_K_M}
      # Context window. Prompts are built to fit inside it minus max-output-tokens.
      num-ctx: ${OLLAMA_NUM_CTX:8192}
      timeout: PT180S
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-haiku-5-5}
      # low, medium or high. medium is Haiku 5.5's own default; Phase 3 decides.
      effort: ${ANTHROPIC_EFFORT:medium}
      # Prompt budget; below 100K tokens, where Haiku 5.5's higher price tier starts.
      max-prompt-tokens: 32000
      timeout: PT120S
  rerank:
    # Cross-encoder sidecar (sidecars/reranker). Off unless configured; the hybrid_rerank mode
    # then returns hybrid results and reports reranking as disabled.
    enabled: ${RERANK_ENABLED:false}
    base-url: ${RERANKER_URL:http://localhost:8001}
    timeout: PT5S
    # How many hybrid results the cross-encoder reorders.
    candidates: ${RERANK_CANDIDATES:30}
  embedding:
    # ollama (local model) or hashing (deterministic, no model; for tests only)
    provider: ${EMBEDDING_PROVIDER:ollama}
    batch-size: 16
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      # nomic-embed-text was trained with these task prefixes. Other models need different ones.
      document-prefix: "search_document: "
      query-prefix: "search_query: "
      timeout: PT60S

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
